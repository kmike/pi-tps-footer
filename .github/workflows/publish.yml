name: publish

# Publishes to npm when a semver tag (v1.2.3) is pushed, iff the tag matches
# package.json's version. Driven by `npm version patch && git push --follow-tags`.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write   # required for npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org   # reads $NODE_AUTH_TOKEN

      - name: Verify tag matches package.json version
        run: |
          node -e "\
          const {version} = require('./package.json');\
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');\
          if (version !== tag) {\
            console.error('Tag v'+tag+' does not match package.json version '+version);\
            process.exit(1);\
          }"

      - run: npm test

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
