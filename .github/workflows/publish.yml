name: publish

on:
  # Release flow: `npm version minor && git push --follow-tags` — the tag push
  # triggers the publish.
  push:
    tags: ["v*"]
  # Manual escape hatch (e.g. a tag pushed before CI existed): publishes
  # whatever version is in package.json on the default branch.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test # prepublishOnly runs it too; fail fast with clean output
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
